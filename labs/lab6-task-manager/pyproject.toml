[project]
name = "lab6-task-manager"
version = "0.1.0"
description = "FastAPI task manager with PostgreSQL and Alembic"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.162.0", "uvicorn[standard]==0.54.0", "sqlalchemy==2.0.48",
  "asyncpg==0.32.0", "pydantic==2.14.1", "pydantic-settings==2.16.1",
  "alembic==1.20.1", "email-validator==2.3.0",
]
[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.1.1", "pytest-asyncio==1.4.1", "pytest-cov==7.1.0", "ruff==0.14.14"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=80"
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008"] # FastAPI Depends/Query are declarative parameter definitions.
