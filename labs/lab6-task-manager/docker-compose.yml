services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-tasks}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-tasks}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  test-db:
    image: postgres:16
    profiles: [test]
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: tasks_test
    ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d tasks_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  tests:
    profiles: [test]
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@test-db:5432/tasks_test
      TEST_DATABASE_URL: postgresql+asyncpg://app:app@test-db:5432/tasks_test
    depends_on:
      test-db:
        condition: service_healthy
volumes:
  pgdata:
