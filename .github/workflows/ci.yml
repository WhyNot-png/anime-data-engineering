name: CI

on:
  push:
    branches: [main, lab1-compliance]
    tags: [lab1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12.12", "3.13.9"]
    env:
      UV_PYTHON: ${{ matrix.python }}
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install exact managed Python
        run: uv python install ${{ matrix.python }}
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check .
      - name: Formatting
        run: uv run --locked ruff format --check .
      - name: Strict typing (src and tests)
        run: uv run --locked mypy
      - name: Tests and coverage (minimum 70 percent)
        run: uv run --locked pytest
      - name: CLI help
        run: uv run --locked rg --help
      - name: CLI configuration (no secrets required)
        run: uv run --locked rg check-config
      - name: Repository hygiene
        run: uv run --locked python scripts/check_repository.py
      - name: Pre-commit (same tools and lockfile)
        run: uv run --locked pre-commit run --all-files --show-diff-on-failure
      - name: Build distributable package
        run: uv build --no-sources
