name: CI

on:
  push:
    branches: ["**"]
    paths: ["anime-portal/**", ".github/workflows/anime-portal-ci.yml"]
  pull_request:
    paths: ["anime-portal/**", ".github/workflows/anime-portal-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anime-portal-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: anime-portal

jobs:
  quality:
    name: Lint, типы, тесты и покрытие
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anime
          POSTGRES_PASSWORD: anime
          POSTGRES_DB: anime_portal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U anime -d anime_portal_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://anime:anime@localhost:5432/anime_portal_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: anime-portal/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Миграции на PostgreSQL (upgrade + downgrade)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: ETL и seed на PostgreSQL (идемпотентность)
        run: |
          python -m app.etl.import_anime --source data/anime.csv --report logs/etl-1.json
          python -m app.etl.import_anime --source data/anime.csv --report logs/etl-2.json
          python scripts/seed.py --skip-etl
      - name: Pytest с покрытием (порог 70%)
        run: pytest
      - name: Отчёт о покрытии в артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: anime-portal/htmlcov
          if-no-files-found: ignore
      - name: SMOKE: живой сервер отвечает на /health и /api/v1/anime
        run: |
          uvicorn app.main:app --port 8001 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8001/health && break || sleep 1; done
          curl -fsS "http://127.0.0.1:8001/api/v1/anime?size=2" > /dev/null
          curl -fsS http://127.0.0.1:8001/openapi.json > /dev/null
          curl -fsS http://127.0.0.1:8001/ | grep -q "Anime Portal"

  docker:
    name: Сборка Docker-образа и запуск compose
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up и проверка API
        working-directory: anime-portal
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS "http://127.0.0.1:8000/api/v1/anime?size=3" > /dev/null
          curl -fsS "http://127.0.0.1:8000/api/v1/analytics/top-anime" > /dev/null
      - name: Логи и очистка
        if: always()
        working-directory: anime-portal
        run: docker compose logs --no-color && docker compose down -v
