name: Lab 6 Task API
on:
  push:
    branches: [main]
    paths: ['labs/lab6-task-manager/**', '.github/workflows/lab6-api.yml']
  pull_request:
    paths: ['labs/lab6-task-manager/**', '.github/workflows/lab6-api.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: labs/lab6-task-manager
    env:
      UV_PYTHON: 3.12.12
      UV_PYTHON_PREFERENCE: only-managed
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/tasks
      TEST_DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/tasks_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.13.5'
          enable-cache: true
          cache-dependency-glob: labs/lab6-task-manager/uv.lock
      - name: Locked dependencies and lint
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
      - name: Start real Docker Compose API and PostgreSQL
        run: |
          docker compose config --quiet
          docker compose up -d --build app
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/openapi.json -o /tmp/openapi.json; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/openapi.json -o /tmp/openapi.json
      - name: Real HTTP smoke through container
        run: uv run python scripts/smoke_api.py
      - name: Prepare isolated PostgreSQL test database
        run: |
          docker compose exec -T db psql -U app -d tasks -v ON_ERROR_STOP=1 -c 'CREATE DATABASE tasks_test OWNER app;'
          DATABASE_URL="$TEST_DATABASE_URL" uv run alembic upgrade head
      - name: Integration tests and migration drift
        run: |
          uv run pytest
          uv run alembic check
          docker compose exec -T db psql -U app -d tasks -c '\dt'
      - name: Container logs and cleanup
        if: always()
        run: |
          docker compose logs --no-color
          docker compose down -v
