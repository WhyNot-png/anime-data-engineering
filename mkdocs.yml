site_name: Anime Research · T1 + P3
site_description: Воспроизводимая публикация результатов исследований данных MyAnimeList
site_url: https://whynot-png.github.io/anime-data-engineering/
use_directory_urls: true
strict: true
theme:
  name: material
  language: ru
  font: false
  palette:
    scheme: default
    primary: indigo
    accent: teal
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
plugins:
  - search:
      lang: [ru, en]
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight:
      linenums: true
hooks:
  - scripts/site_hooks.py
nav:
  - Начало: index.md
  - T1 · Сравнение генераторов: t1.md
  - P3 · Воспроизводимый конвейер: p3.md
  - Результаты эксперимента: results.md
  - Ход работы и отладка: report.md
  - Лицензии: licenses.md
validation:
  links:
    not_found: warn
    anchors: warn
extra_css:
  - assets/site.css
copyright: Код — MIT · Материалы — CC BY 4.0 · Данные — условия исходного набора
